[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-entity-generator"
version = "0.1.0"
description = "Generate Java JPA entities from Oracle table metadata or DDL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
oracle-entity-generator = "oracle_entity_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
